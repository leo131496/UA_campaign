88" fill="#ff9a76" font-weight="800">6</text><text x="1399" y="510" font-size="21" fill="#c5d5e9" font-weight="400">个回合</text><text x="1399" y="542" font-size="21" fill="#c5d5e9" font-weight="400">等你接管</text><text x="1324" y="591" font-size="13" fill="#b9cce7" font-weight="400">调资源 · 解阻塞 · 和 AI 比策略</text><rect x="1304" y="643" width="294" height="50" rx="12" fill="#ff9871"/><text x="1326" y="675" font-size="17" fill="#302f39" font-weight="600">发给微信好友 / 群</text><text x="1306" y="724" font-size="18" fill="#23344f" font-weight="650">我的邀请效果</text><rect x="1304" y="743" width="141" height="55" rx="10" fill="#e7eef8"/><text x="1321" y="778" font-size="26" fill="#587aa8" font-weight="650">0</text><text x="1357" y="777" font-size="12" fill="#6e87aa" font-weight="400">新增到访</text><rect x="1457" y="743" width="141" height="55" rx="10" fill="#e7eef8"/><text x="1474" y="778" font-size="26" fill="#587aa8" font-weight="650">0</text><text x="1510" y="777" font-size="12" fill="#6e87aa" font-weight="400">完成挑战</text><rect x="1304" y="807" width="141" height="55" rx="10" fill="#e7eef8"/><text x="1321" y="842" font-size="26" fill="#587aa8" font-weight="650">0</text><text x="1357" y="841" font-size="12" fill="#6e87aa" font-weight="400">领取资料</text><rect x="1457" y="807" width="141" height="55" rx="10" fill="#e7eef8"/><text x="1474" y="842" font-size="26" fill="#587aa8" font-weight="650">0</text><text x="1510" y="841" font-size="12" fill="#6e87aa" font-weight="400">主动咨询</text><text x="1308" y="889" font-size="11" fill="#8193ac" font-weight="400">演示不生成虚假新增，分享点击不计数。</text><text x="56" y="982" font-size="15" fill="#19365d" font-weight="650">设计稿说明</text><text x="160" y="982" font-size="15" fill="#687f9b" font-weight="400">依据当前原生页面制作的静态沟通稿，非微信开发者工具或真机截图。</text><text x="56" y="1013" font-size="14" fill="#7c90a9" font-weight="400">正式体验需配置 AppID 与云服务；咨询、营销和附加游戏复盘分别授权。</text></svg>