 不产生真实获客数据</text><rect x="578" y="903" width="106" height="4" rx="2" fill="#c9d4e4"/><rect x="484" y="315" width="294" height="145" rx="18" fill="#19365d"/><text x="502" y="346" font-size="18" fill="#ffffff" font-weight="650">回合 3 / 6</text><text x="670" y="345" font-size="12" fill="#b8cce7" font-weight="400">剩 2 次行动</text><text x="502" y="376" font-size="12" fill="#bdcee6" font-weight="400">可用预算</text><text x="639" y="376" font-size="12" fill="#bdcee6" font-weight="400">项目风险</text><text x="502" y="417" font-size="35" fill="#ffffff" font-weight="700">61</text><text x="639" y="417" font-size="35" fill="#ffffff" font-weight="700">34</text><text x="502" y="445" font-size="12" fill="#c6d9f1" font-weight="400">!  协作中断 · 先解除模块阻塞</text><text x="486" y="490" font-size="16" fill="#23344f" font-weight="650">项目现场</text><text x="642" y="490" font-size="12" fill="#7890ad" font-weight="400">点卡片 → 点模块</text><rect x="484" y="507" width="92" height="116" rx="12" fill="#fff" stroke="#d9e4f1"/><text x="494" y="531" font-size="11" fill="#8b9db7" font-weight="400">01</text><text x="494" y="557" font-size="14" fill="#23344f" font-weight="600">业务启动</text><text x="494" y="581" font-size="11" fill="#7489a6" font-weight="400">等待推进</text><text x="494" y="608" font-size="16" fill="#395a83" font-weight="650">48 / 80</text><rect x="585" y="507" width="92" height="116" rx="12" fill="#fff4eb" stroke="#f2bb9e"/><text x="595" y="531" font-size="11" fill="#8b9db7" font-weight="400">02</text><text x="595" y="557" font-size="14" fill="#23344f" font-weight="600">团队协作</text><text x="595" y="581" font-size="11" fill="#aa7956" font-weight="400">阻塞中</text><text x="595" y="608" font-size="16" fill="#395a83" font-weight="650">24 / 80</text><rect x="686" y="507" width="92" height="116" rx="12" fill="#fff" stroke="#d9e4f1"/><text x="696" y="531" font-size="11" fill="#8b9db7" font-weight="400">03</text><text x="696" y="557" font-size="14" fill="#23344f" font-weight="600">交付落地</text><text x="696" y="581" font-size="11" fill="#7489a6" font-weight="400">自动推进</text><text x="696" y="608" font-size="16" fill="#395a83" font-weight="650">18 / 80</text><text x="486" y="652" font-size="16" fill="#23344f" font-weight="650">你的资源卡</text><rect x="484" y="668" width="92" height="67" rx="10" fill="#fff" stroke="#dce5f1"/><text x="494" y="690" font-size="10" fill="#8b9db7" font-weight="400">9 点</text><text x="494" y="710" font-size="13" fill="#23344f" font-weight="600">集中推进</text><text x="494" y="727" font-size="10" fill="#7489a3" font-weight="400">进度 +24</text><rect x="585" y="668" width="92" height="67" rx="10" fill="#fff" stroke="#dce5f1"/><text x="595" y="690" font-size="10" fill="#8b9db7" font-weight="400">17 点</text><text x="595" y="710" font-size="13" fill="#23344f" font-weight="600">专家支援</text><text x="595" y="727" font-size="10" fill="#7489a3" font-weight="400">进度 +38</text><rect x="686" y="668" width="92" height="67" rx="10" fill="#fff0e7" stroke="#edb197"/><text x="696" y="690" font-size="10" fill="#8b9db7" font-weight="400">9 点</text><text x="696" y="710" font-size="13" fill="#23344f" font-weight="600">排除阻塞</text><text x="696" y="727" font-size="10" fill="#7489a3" font-weight="400">解锁 / 降风险</text><rect x="484" y="745" width="92" height="67" rx="10" fill="#fff" stroke="#dce5f1"/><text x="494" y="767" font-size="10" fill="#8b9db7" font-weight="400">18 点</text><text x="494" y="787" font-size="13" fill="#23344f" font-weight="600">自动化</text><text x="494" y="804" font-size="10" fill="#7489a3" font-weight="400">每轮 +10</text><rect x="585" y="745" width="92" height="67" rx="10" fill="#fff" stroke="#dce5f1"/><text x="595" y="767" font-size="10" fill="#8b9db7" font-weight="400">7 点</text><text x="595" y="787" font-size="13" fill="#23344f" font-weight="600">团队协同</text><text x="595" y="804" font-size="10" fill="#7489a3" font-weight="400">两处推进</text><rect x="686" y="745" width="92" height="67" rx="10" fill="#fff" stroke="#dce5f1"/><text x="696" y="767" font-size="10" fill="#8b9db7" font-weight="400">0 点</text><text x="696" y="787" font-size="13" fill="#23344f" font-weight="600">调配资源</text><text x="696" y="804" font-size="10" fill="#7489a3" font-weight="400">预算 +15</text><rect x="484" y="834" width="294" height="50" rx="12" fill="#e7effb"/><text x="506" y="866" font-size="17" fill="#557aa9" font-weight="600">✦ AI 帮我想一步</text><text x="876" y="159" font-size="15" fill="#ee805b" font-weight="700">03</text><text x="908" y="159" font-size="20" fill="#23344f" font-weight="650">有用，才值得带走</text><rect x="870" y="183" width="342" height="744" rx="36" fill="#ffffff" stroke="#d6dfeb"/><rect x="876" y="189" width="330" height="732" rx="31" fill="#f5f7fa"/><text x="896" y="219" font-size="13" fill="#23344f" font-weight="600">9:41</text><text x="1142" y="219" font-size="14" fill="#23344f" font-weight="400">•••  ▰</text><text x="896" y="254" font-size="25" fill="#23344f" font-weight="400">‹</text><text x="991" y="251" font-size="16" fill="#23344f" font-weight="650">项目启动工具包</text><rect x="894" y="272" width="294" height="26" rx="7" fill="#fff0e3"/><text x="903" y="290" font-size="11" fill="#9b6b43" font-weight="400">本地演示 · 不产生真实获客数据</text><rect x="988" y="903" width="106" height="4" rx="2" fill="#c9d4e4"/><text x="896" y="336" font-size="12" fill="#548367" font-weight="400">已存入「我的资料」</text><text x="896" y="378" font-size="26" fill="#19365d" font-weight="700">项目启动工具包</text><text x="896" y="409" font-size="14" fill="#6b809b" font-weight="400">拿去开一次会，或复制到工作文档。</text><rect x="894" y="435" width="294" height="166" rx="16" fill="#fff"/><text x="912" y="465" font-size="17" fill="#23344f" font-weight="650">01 / 开工前，对齐四件事</text><text x="912" y="496" font-size="12" fill="#657b96" font-weight="400">□ 写清交付物及不在本次范围内的事项</text><text x="912" y="522" font-size="12" fill="#657b96" font-weight="400">□ 确定最终负责人和验收人</text><text x="912" y="548" font-size="12" fill="#657b96" font-weight="400">□ 约定可观察的验收标准</text><text x="912" y="574" font-size="12" fill="#657b96" font-weight="400">□ 记录前置依赖和最晚确认日