<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1680" height="1050" rx="0" fill="#edf2f8"/><text x="56" y="63" font-size="34" fill="#19365d" font-weight="750">项目急救局</text><text x="288" y="61" font-size="20" fill="#627995" font-weight="400">微信原生小程序 / 手机交互设计稿</text><text x="56" y="103" font-size="19" fill="#657b96" font-weight="400">直接开玩 → 带走实用工具 → 自愿分享给同行 → 主动咨询 → SCRM 承接</text><text x="56" y="159" font-size="15" fill="#ee805b" font-weight="700">01</text><text x="88" y="159" font-size="20" fill="#23344f" font-weight="650">先玩，再了解</text><rect x="50" y="183" width="342" height="744" rx="36" fill="#ffffff" stroke="#d6dfeb"/><rect x="56" y="189" width="330" height="732" rx="31" fill="#f5f7fa"/><text x="76" y="219" font-size="13" fill="#23344f" font-weight="600">9:41</text><text x="322" y="219" font-size="14" fill="#23344f" font-weight="400">•••  ▰</text><text x="76" y="254" font-size="25" fill="#23344f" font-weight="400">‹</text><text x="171" y="251" font-size="16" fill="#23344f" font-weight="650">项目急救局</text><rect x="74" y="272" width="294" height="26" rx="7" fill="#fff0e3"/><text x="83" y="290" font-size="11" fill="#9b6b43" font-weight="400">本地演示 · 不产生真实获客数据</text><rect x="168" y="903" width="106" height="4" rx="2" fill="#c9d4e4"/><rect x="74" y="315" width="294" height="251" rx="18" fill="#19365d"/><text x="94" y="345" font-size="12" fill="#b0c5e2" font-weight="600">MISSION / 06</text><text x="94" y="396" font-size="38" fill="#ffffff" font-weight="750">项目急救局</text><text x="94" y="428" font-size="16" fill="#bdcee6" font-weight="400">只剩 6 个回合，</text><text x="94" y="453" font-size="16" fill="#bdcee6" font-weight="400">你能救回这个项目吗？</text><rect x="96" y="477" width="54" height="49" rx="12" fill="#ff9871"/><text x="115" y="510" font-size="27" fill="#19365d" font-weight="650">!</text><text x="99" y="548" font-size="13" fill="#c7d7ec" fon