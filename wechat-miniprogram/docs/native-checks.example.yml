name: Native mini-program checks
on:
  push:
    paths: ['wechat-miniprogram/**', 'game/engine.js', '.github/workflows/native-checks.yml']
  pull_request:
    paths: ['wechat-miniprogram/**', 'game/engine.js', '.github/workflows/native-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/engine.test.cjs
      - run: npm test
        working-directory: wechat-miniprogram
      - run: npm run check
        working-directory: wechat-miniprogram
